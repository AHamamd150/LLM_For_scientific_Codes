[pytest]
addopts = --import-mode=importlib
testpaths =
    packages/helper-selector/tests
    packages/golden-axe-oracle/tests
    packages/critique-pipeline/tests
    backends/code-generator/tests
    domains/lhco-domain/tests
    domains/dummy-domain/tests
    workflows/tests
    tests
pythonpath =
    packages/workbench-contracts/src
    packages/helper-selector/src
    packages/golden-axe-oracle/src
    packages/critique-pipeline/src
    backends/code-generator/src
    domains/lhco-domain/src
    domains/dummy-domain/src
    workflows/src
norecursedirs =
    .git
    .venv
    venv
    build
    dist
    *.egg-info
    run
    runs
