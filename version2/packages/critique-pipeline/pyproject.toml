[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "critique-pipeline"
version = "0.1.0"
description = "Two-stage semantic critique of generated code"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
huggingface = ["requests>=2.31"]

[project.scripts]
critique-pipeline = "critique_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
critique_pipeline = ["prompts/*.txt"]

