[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "helper-selector"
version = "0.1.0"
description = "Model-assisted selection of helpers from a closed registry"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
huggingface = ["huggingface-hub>=0.27"]

[project.scripts]
helper-selector = "helper_selector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
