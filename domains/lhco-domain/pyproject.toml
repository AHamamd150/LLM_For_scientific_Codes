[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lhco-domain"
version = "0.1.0"
description = "LHCO generation profile, prompts, helper registry, and policies"
requires-python = ">=3.10"
dependencies = ["helper-selector"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lhco_domain = ["prompts/*.txt"]
