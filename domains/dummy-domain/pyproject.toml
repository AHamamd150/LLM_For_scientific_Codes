[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dummy-domain"
version = "0.1.0"
description = "Minimal dummy domain for pipeline testing"
requires-python = ">=3.10"
dependencies = [
    "helper-selector",
    "workbench-contracts",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dummy_domain = ["prompts/*.txt"]
